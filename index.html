<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Sadaf Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: one fixed cinematic backdrop per stage, a letterboxed stage, and a single centred card column with a film-strip progress bar. */
:root{
  color-scheme: dark;
  --bg:#202221; --surface:#303531; --muted-ui:#4D574E; --brown:#654922; --gold-mid:#956E2F; --gold:#B68B4B;
  --ink:#F3ECE0; --ink-soft:#C9C1B3; --ink-faint:#9A9387; --line:rgba(243,236,224,.10); --line-strong:rgba(182,139,75,.45);
  --err:#E39A86; --ok:#9DBB8F;
  --font-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --font-en:"Inter","Helvetica Neue",Arial,sans-serif;
  --radius:14px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ar);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="en"] body{font-family:var(--font-en)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
svg.lucide{width:1.15em;height:1.15em;stroke-width:1.5;flex:none}

/* backdrop */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene{position:absolute;inset:-4%;opacity:0;transition:opacity 1.2s var(--ease);background-size:cover;background-position:center;background-repeat:no-repeat}
.scene.flip{transform:scaleX(-1)}
.scene.on{opacity:var(--scene-op,.42);animation:drift 40s ease-in-out infinite alternate}
.scene.flip.on{animation-name:driftFlip}
body.is-welcome .scene.on{--scene-op:.62}
body.is-done .scene.on{--scene-op:.55}
@keyframes drift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.06) translate3d(-1.2%,-.8%,0)}}
@keyframes driftFlip{from{transform:scaleX(-1) scale(1.1)}to{transform:scaleX(-1) scale(1.16) translate3d(-1.2%,-.8%,0)}}
.vignette{position:absolute;inset:0;background:
  radial-gradient(120% 85% at 50% 40%,rgba(32,34,33,.15) 0%,rgba(32,34,33,.55) 62%,rgba(20,21,20,.92) 100%),
  linear-gradient(180deg,rgba(32,34,33,.35),rgba(32,34,33,.15) 35%,rgba(32,34,33,.8))}
.grain{position:absolute;inset:-50%;opacity:.07;background-size:180px;mix-blend-mode:overlay;animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(32,34,33,.92),rgba(32,34,33,.6));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;line-height:1;white-space:nowrap}
.brand .ar{font-family:var(--font-ar);font-weight:600;font-size:20px;color:var(--ink)}
.brand .sep{width:1px;height:16px;background:var(--line-strong);align-self:center}
.brand .en{font-family:var(--font-en);font-weight:500;font-size:12px;letter-spacing:.32em;color:var(--gold)}
.top-actions{display:flex;align-items:center;gap:10px}
.pill-preview{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:999px;padding:5px 10px;white-space:nowrap}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:rgba(48,53,49,.7)}
.lang button{border:0;background:transparent;font-family:var(--font-en);font-size:12px;font-weight:600;letter-spacing:.12em;padding:7px 12px;border-radius:999px;color:var(--ink-faint);min-width:44px;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--gold);color:#1b1c1b}

/* frame */
main{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 140px}
.col{max-width:760px;margin-inline:auto}
.enter{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* welcome */
.welcome{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center;gap:34px;padding-block:20px 0}
.letterbox{position:relative;padding-block:28px}
.letterbox::before,.letterbox::after{content:"";position:absolute;inset-inline:0;height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent)}
.letterbox::before{top:0}.letterbox::after{bottom:0}
.eyebrow{font-family:var(--font-en);font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
html[lang="ar"] .eyebrow{font-family:var(--font-ar);letter-spacing:.04em;font-size:13px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.hero-title{font-weight:300;font-size:clamp(34px,6.4vw,64px);line-height:1.15;margin:14px 0 14px;text-wrap:balance;letter-spacing:-.01em}
html[lang="ar"] .hero-title{letter-spacing:0;line-height:1.3}
.hero-title em{font-style:normal;color:var(--gold);font-weight:500}
.hero-sub{color:var(--ink-soft);font-size:clamp(16px,2.1vw,19px);max-width:34em;margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.choices{grid-template-columns:1fr}}
.choice{position:relative;text-align:start;border:1px solid var(--line);background:linear-gradient(160deg,rgba(48,53,49,.92),rgba(36,39,37,.92));border-radius:18px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:14px;min-height:170px;overflow:hidden;transition:border-color .3s,transform .3s var(--ease),box-shadow .3s}
.choice::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:120%;background:radial-gradient(50% 50% at 50% 50%,rgba(182,139,75,.18),transparent 70%);opacity:0;transition:opacity .4s}
.choice:hover,.choice:focus-visible{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
.choice:hover::after,.choice:focus-visible::after{opacity:1}
.choice .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line-strong);color:var(--gold);font-size:22px}
.choice .ttl{font-size:21px;font-weight:500}
.choice .meta{color:var(--ink-faint);font-size:14px}
.choice .go{position:absolute;inset-inline-end:20px;top:24px;color:var(--gold);opacity:.7}
.process{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--line);padding-top:22px}
@media (max-width:620px){.process{grid-template-columns:1fr}}
.process div{display:flex;gap:10px;align-items:flex-start;color:var(--ink-soft);font-size:14px}
.process b{font-family:var(--font-en);font-weight:500;color:var(--gold);font-size:12px;letter-spacing:.1em;border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px;margin-top:2px}

/* progress (film strip) */
.progress{margin-bottom:26px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.prog-head .scene-no{font-family:var(--font-en);font-size:11.5px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.prog-head .fmt{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.prog-head .fmt button{border:0;background:none;color:var(--gold);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:7px 6px;border-radius:6px;background:rgba(20,21,20,.6);border:1px solid var(--line);position:relative}
.strip::before,.strip::after{content:"";position:absolute;inset-inline:10px;height:3px;background:repeating-linear-gradient(90deg,rgba(243,236,224,.18) 0 6px,transparent 6px 14px)}
.strip::before{top:2px}.strip::after{bottom:2px}
.frame{height:12px;border-radius:2px;background:rgba(77,87,78,.55);transition:background .5s}
.frame.f-done{background:var(--gold-mid)}
.frame.f-cur{background:var(--gold);box-shadow:0 0 14px rgba(182,139,75,.6)}

/* step card */
.step-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.step-head .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-strong);color:var(--gold);font-size:20px;flex:none;background:rgba(101,73,34,.18)}
.step-title{font-size:clamp(26px,4.4vw,36px);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
.step-sub{margin:6px 0 0;color:var(--ink-soft)}
.card{background:rgba(48,53,49,.82);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3.4vw,30px);display:flex;flex-direction:column;gap:26px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:600px){.row2{grid-template-columns:1fr}}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:500;font-size:15px}
.tag{font-size:12px;font-weight:400;color:var(--ink-faint);border:1px solid var(--line);padding:1px 8px;border-radius:999px;white-space:nowrap}
.tag.req{color:var(--gold);border-color:var(--line-strong)}
.help{font-size:13.5px;color:var(--ink-faint);margin:-2px 0 0}
.input,.textarea,.select{width:100%;background:rgba(32,34,33,.75);border:1px solid rgba(243,236,224,.14);border-radius:12px;padding:13px 14px;min-height:50px;transition:border-color .2s,box-shadow .2s;font-size:16px}
.textarea{resize:none;min-height:110px;line-height:1.7;overflow:hidden}
.input::placeholder,.textarea::placeholder{color:#7d786f}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(182,139,75,.18)}
.has-err .input,.has-err .textarea,.has-err .phone-wrap{border-color:var(--err)}
.err{display:flex;gap:6px;align-items:center;color:var(--err);font-size:13.5px}
.counter{font-family:var(--font-en);font-size:12px;color:var(--ink-faint);align-self:flex-end;font-variant-numeric:tabular-nums}
.counter.near{color:var(--gold)}
.phone-wrap{display:flex;border:1px solid rgba(243,236,224,.14);border-radius:12px;background:rgba(32,34,33,.75);overflow:hidden}
.phone-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(182,139,75,.18)}
.phone-wrap select{border:0;background:rgba(77,87,78,.35);padding:0 10px;font-family:var(--font-en);font-size:15px;min-width:96px;direction:ltr}
.phone-wrap input{border:0;background:transparent;flex:1;min-width:0;padding:13px 14px;font-family:var(--font-en);direction:ltr;font-size:16px}
.phone-wrap select:focus,.phone-wrap input:focus{outline:none}
.select option{background:var(--surface)}

/* chips & option cards */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid rgba(243,236,224,.16);background:rgba(32,34,33,.6);border-radius:999px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;font-size:15px;transition:all .2s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:rgba(182,139,75,.16);border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"] .ck,.chip[aria-checked="true"] .ck{display:inline-flex}
.chip .ck{display:none;color:var(--gold)}
.search{position:relative}
.search .lucide{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.search .input{padding-inline-start:42px}
.grid-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.opt{position:relative;border:1px solid rgba(243,236,224,.14);background:rgba(32,34,33,.6);border-radius:14px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:14.5px;min-height:96px;justify-content:center;transition:all .22s}
.opt .lucide{width:24px;height:24px;color:var(--ink-soft);transition:color .2s,transform .3s var(--ease)}
.opt:hover{border-color:var(--line-strong)}
.opt:hover .lucide{transform:translateY(-2px)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{background:linear-gradient(170deg,rgba(182,139,75,.2),rgba(101,73,34,.18));border-color:var(--gold)}
.opt[aria-pressed="true"] .lucide,.opt[aria-checked="true"] .lucide{color:var(--gold)}
.opt .tick{position:absolute;top:8px;inset-inline-end:8px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1b1c1b;display:none;place-items:center}
.opt .tick .lucide{width:12px;height:12px;color:#1b1c1b;stroke-width:2.5}
.opt[aria-pressed="true"] .tick,.opt[aria-checked="true"] .tick{display:grid}
.opt.wide{flex-direction:row;justify-content:flex-start;text-align:start;min-height:72px;padding:16px 18px;gap:14px;font-size:15.5px}
.grid-wide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid-wide{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid rgba(243,236,224,.14);border-radius:12px;padding:4px;gap:4px;background:rgba(32,34,33,.6);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 16px;min-height:42px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft)}
.seg button[aria-checked="true"]{background:var(--gold);color:#1b1c1b}
.inline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.inline .input{max-width:180px}
.reveal{animation:enter .35s var(--ease) both}

/* characters */
.chars{display:flex;flex-direction:column;gap:14px}
.char{border:1px solid var(--line);border-radius:14px;padding:16px;background:rgba(32,34,33,.5);display:flex;flex-direction:column;gap:14px}
.char-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.char-head span{font-family:var(--font-en);font-size:11.5px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
html[lang="ar"] .char-head span{font-family:var(--font-ar);letter-spacing:.02em;font-size:13px}
.ghost-btn{border:1px dashed var(--line-strong);background:transparent;border-radius:12px;padding:13px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--gold);min-height:48px}
.ghost-btn:hover{background:rgba(182,139,75,.08)}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-faint)}
.icon-btn:hover{color:var(--err);border-color:rgba(227,154,134,.5)}
.confirm-del{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-soft);flex-wrap:wrap}
.confirm-del button{border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:transparent;min-height:36px}
.confirm-del .yes{border-color:rgba(227,154,134,.6);color:var(--err)}

/* upload */
.drop{border:1.5px dashed rgba(182,139,75,.5);border-radius:16px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(32,34,33,.45);transition:all .2s}
.drop.over{background:rgba(182,139,75,.1);border-color:var(--gold)}
.drop .big{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);color:var(--gold);font-size:22px}
.limits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-family:var(--font-en);font-size:12px;color:var(--ink-faint)}
.limits span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.files{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(32,34,33,.6)}
.file .meta{flex:1;min-width:0}
.file .nm{font-family:var(--font-en);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.file .st{font-size:12.5px;color:var(--ink-faint);display:flex;gap:6px;align-items:center}
.file.bad{border-color:rgba(227,154,134,.45)}
.file.bad .st{color:var(--err)}
.file.ok .st{color:var(--ok)}
.bar{height:3px;border-radius:3px;background:rgba(243,236,224,.1);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}

/* review */
.rev{display:flex;flex-direction:column;gap:14px}
.rev-sec{border:1px solid var(--line);border-radius:14px;background:rgba(32,34,33,.5);padding:16px 18px}
.rev-sec header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.rev-sec h3{margin:0;font-size:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.rev-sec h3 .lucide{color:var(--gold)}
.edit-btn{border:1px solid var(--line-strong);background:transparent;color:var(--gold);border-radius:999px;padding:6px 14px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.rev dl{margin:0;display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:8px 16px}
@media (max-width:520px){.rev dl{grid-template-columns:1fr;gap:2px}.rev dd{margin-bottom:10px}}
.rev dt{color:var(--ink-faint);font-size:14px}
.rev dd{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.rev dd.none{color:#7d786f}
.agree{display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(243,236,224,.14);border-radius:14px;padding:16px;background:rgba(32,34,33,.5);cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--gold-mid);flex:none;margin-top:2px;display:grid;place-items:center;background:transparent;cursor:pointer}
.check input:checked{background:var(--gold);border-color:var(--gold)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #1b1c1b;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.has-err{border-color:var(--err)}
.link{color:var(--gold);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font:inherit}
.notice{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--line-strong);border-radius:14px;padding:14px 16px;color:var(--ink-soft);font-size:14px;background:rgba(101,73,34,.12)}
.notice .lucide{color:var(--gold);margin-top:3px}
.notice.err-box{border-color:rgba(227,154,134,.55);background:rgba(227,154,134,.08);color:var(--ink)}
.notice.err-box .lucide{color:var(--err)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:15;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(32,34,33,.98) 60%,rgba(32,34,33,0));}
.nav .col{display:flex;gap:12px;justify-content:space-between;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:14px 24px;min-height:54px;font-weight:500;font-size:16px;border:1px solid transparent;transition:all .2s}
.btn-primary{background:var(--gold);color:#1b1c1b;min-width:160px}
.btn-primary:hover{background:#c49a5a}
.btn-primary[disabled]{opacity:.75;cursor:progress}
.btn-quiet{background:rgba(48,53,49,.85);border-color:var(--line);color:var(--ink-soft)}
.btn-quiet:hover{border-color:var(--line-strong);color:var(--ink)}
.nav .spacer{flex:1}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* done */
.done{min-height:calc(100vh - 220px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:20px}
.seal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);background:radial-gradient(circle,rgba(182,139,75,.25),transparent 70%);color:var(--gold);font-size:40px;animation:seal 1s var(--ease) both}
.seal .lucide{width:42px;height:42px;stroke-width:1.25}
@keyframes seal{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.done h1{font-weight:300;font-size:clamp(32px,5.6vw,52px);margin:0;line-height:1.2}
.done p{max-width:32em;color:var(--ink-soft);margin:0}
.ref{display:inline-flex;flex-direction:column;gap:2px;border:1px solid var(--line-strong);border-radius:12px;padding:12px 22px;background:rgba(48,53,49,.7)}
.ref small{color:var(--ink-faint);font-size:12.5px}
.ref b{font-family:var(--font-en);font-weight:500;letter-spacing:.14em;font-size:20px;color:var(--gold);direction:ltr}
.mock{width:100%;max-width:520px;border:1px solid var(--line);border-radius:16px;padding:22px;background:rgba(48,53,49,.6);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.mock .cap{font-family:var(--font-en);font-size:11px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase}
html[lang="ar"] .mock .cap{font-family:var(--font-ar);letter-spacing:0;font-size:12.5px}
.mock h2{margin:0;font-weight:400;font-size:24px}

/* modal / overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(14,15,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.dialog{width:100%;max-width:640px;max-height:84vh;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:enter .35s var(--ease) both}
.dialog h2{margin:0;font-weight:500;font-size:22px;display:flex;gap:10px;align-items:center}
.dialog h2 .lucide{color:var(--gold)}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.legal{white-space:pre-wrap;font-size:14.5px;line-height:1.8;color:var(--ink-soft);overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-faint);border-top:1px solid var(--line);padding-top:18px}
.foot .link{color:var(--ink-soft)}
.count-big{font-family:var(--font-en);font-size:44px;font-weight:300;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .scene.on{animation:none}
  .grain{animation:none}
}
</style>
</head>

    ar: { terms: "الشروط والأحكام\nشركة الصدف للإنتاج الإعلامي («الصدف»، «نحن»)\nآخر تحديث: 26 أكتوبر 2026\n\nبتحديدك مربع الموافقة وتقديمك فكرة عبر هذه المنصة، فإنك («أنت»، «مقدّم الفكرة») توافق على هذه الشروط. إذا كنت لا توافق عليها، فنرجو عدم التقديم.\n\n1. الأهلية\nيجب ألا يقل عمرك عن 18 سنة. تقدّم الفكرة عن نفسك فقط، أو نيابةً عن شركاء في العمل خوّلوك بتقديمها وقبول هذه الشروط عنهم.\n\n2. الفكرة المقدّمة ليست سرّية\nتقرّ بأن ما تقدّمه، وكل ما ترفقه أو ترسل رابطه، لا يُستلم على سبيل السرّية، ولا ينشأ بتقديمه أو بمراجعتنا له أي علاقة سرّية أو ائتمانية أو وكالة أو شراكة أو عمل بينك وبين الصدف.\n\n3. الصدف تطوّر مشاريعها الخاصة\nتعمل الصدف باستمرار على تطوير أفلام ومسلسلات ومحتوى آخر بمفردها ومع شركائها، وتستقبل عددًا كبيرًا من الأفكار من مصادر مختلفة. وتقرّ بأن الصدف قد تكون لديها، أو قد تبتكر أو تستحوذ أو تستقبل لاحقًا بشكل مستقل، مشاريع ومواد مشابهة أو مطابقة لفكرتك من حيث الموضوع أو الفكرة أو المفهوم أو الشكل أو العنوان أو المكان أو الشخصيات أو الأحداث أو البناء أو أي عنصر آخر.\n\n4. حرية تطوير مشاريع مشابهة\nتوافق على أن للصدف وشركائها والمرخّص لهم والجهات التابعة لها حرية تطوير أي مشروع وإنتاجه وتوزيعه واستغلاله، بما في ذلك المشاريع المشابهة أو المطابقة لفكرتك، دون أي التزام تجاهك، ما دامت الصدف لم تنسخ الصياغة المكتوبة المحددة لما قدّمته. فالأفكار والمفاهيم والمواضيع والأشكال والأنواع والشخصيات والمواقف الشائعة لا يملكها شخص بعينه، ولا يقيّد تقديمك الصدف من استخدامها.\n\n5. لا التزام\nلا تلتزم الصدف بقراءة فكرتك أو مراجعتها أو تقييمها أو الرد عليها أو الاحتفاظ بها أو إعادتها أو استخدامها، ولا بتبرير أي قرار. وقرار عدم المضي في الفكرة نهائي.\n\n6. لا مقابل ولا إشارة\nلا يمنحك التقديم أي حق في مبلغ أو أجر أو عائد أو نسبة أرباح أو ذكر للاسم أو أي منفعة أخرى. ولا تنشأ أي علاقة أو مقابل أو إشارة إلا باتفاق مكتوب مستقل يوقّعه ممثل مفوّض من الصدف، ولا يُستنتج أي اتفاق أو وعد من أي محادثة أو اجتماع أو بريد إلكتروني أو مراجعة أو تصرف آخر.\n\n7. الإبراء والتنازل\nإلى أقصى حد يسمح به النظام، تُبرئ الصدف وشركاءها والمرخّص لهم والجهات التابعة لها وموظفيها ومتعاقديها، وتتنازل عن أي مطالبة وتلتزم بعدم رفعها، فيما ينشأ عن أو يتعلق بـ: (أ) أي تشابه بين فكرتك وأي مشروع أو مادة للصدف أو شركائها، أو (ب) استخدام أي فكرة أو مفهوم أو موضوع أو عنصر غير محمي نظامًا، أو (ج) مراجعة الصدف لفكرتك أو التعامل معها أو حفظها أو حذفها.\n\n8. طريقة المطالبة\nإذا رأيت، رغم ما سبق، أن الصدف استخدمت مادة محمية تخصّك، فتلتزم بإشعار الصدف كتابيًا على info@sadaf.tv قبل اتخاذ أي إجراء آخر، وبمنح مهلة لا تقل عن 60 يومًا لمعالجة الأمر. وإلى الحد الذي يسمح به النظام، يقتصر أي تعويض على التعويض المالي، ولا يحق لك طلب إيقاف أي مشروع أو تأخيره أو التدخل في تطويره أو إنتاجه أو توزيعه أو الترويج له.\n\n9. ضماناتك\nتؤكد أن ما قدّمته عمل أصلي من إنتاجك، وأنك تملكه أو تملك كل الحقوق اللازمة لتقديمه، وأنه لا يعتدي على حقوق أي طرف، ولا يتضمن مواد غير نظامية أو مسيئة أو سرّية تخص غيرك. وتلتزم بتعويض الصدف عن أي خسارة أو مطالبة أو تكلفة تنشأ عن الإخلال بهذه الضمانات.\n\n10. احتفظ بنسخك\nلا ترسل نسختك الوحيدة من أي مادة. يحق للصدف الاحتفاظ بالمواد المقدّمة أو أرشفتها أو حذفها وفق تقديرها، ولا تتحمل مسؤولية فقدانها أو تلفها.\n\n11. حدود المسؤولية\nإلى أقصى حد يسمح به النظام، لا تتحمل الصدف المسؤولية عن أي خسارة غير مباشرة أو عرضية أو تبعية، أو فوات فرصة، تنشأ عن استخدامك لهذه المنصة أو عن فكرتك.\n\n12. أحكام عامة\nتمثّل هذه الشروط الاتفاق الكامل بشأن ما تقدّمه، وتلغي ما سبقها من أقوال أو مراسلات. وإذا تبيّن عدم نفاذ أي جزء منها، تبقى بقية الأحكام سارية. ويحق للصدف تحديث هذه الشروط في أي وقت، وتسري على كل تقديم النسخةُ المعروضة وقت تقديمه.\n\n13. النظام الحاكم واللغة\nتخضع هذه الشروط لأنظمة المملكة العربية السعودية، وتختص المحاكم المختصة في مدينة الرياض حصريًا بالنظر في أي نزاع. صدرت هذه الشروط باللغتين العربية والإنجليزية، وعند الاختلاف يُعتمد النص العربي.\n\nللتواصل: info@sadaf.tv", privacy: "سياسة الخصوصية\nشركة الصدف للإنتاج الإعلامي («الصدف»، «نحن»)\nآخر تحديث: 26 أكتوبر 2026\n\nتوضّح هذه السياسة كيف نتعامل مع البيانات الشخصية المقدّمة عبر هذه المنصة، وفقًا لنظام حماية البيانات الشخصية في المملكة العربية السعودية.\n\n1. البيانات التي نجمعها\nاسمك، ورقم جوالك، وبريدك الإلكتروني، ومجالك أو مهنتك، وما إذا كانت هذه أول تجربة لك بالكتابة، ومدينتك ودولتك، وتفاصيل فكرتك وقصتك، ووصف الشخصيات، وأي روابط تشاركها. لا نجمع بيانات لم تكتبها بنفسك، ولا تحفظ المنصة إجاباتك على الجهاز المستخدم.\n\n2. لماذا نستخدمها\nفقط لاستلام فكرتك ومراجعتها وتقييمها، والتواصل معك بشأنها، والاحتفاظ بسجل لما قُدّم وتاريخه (بما في ذلك حماية الصدف عند أي نزاع). لا نبيع بياناتك ولا نستخدمها لأغراض إعلانية.\n\n3. الأساس النظامي\nموافقتك التي تمنحها بتحديد المربع قبل التقديم، ومصلحة الصدف المشروعة في الاحتفاظ بسجل للمقدّمات. يحق لك سحب موافقتك في أي وقت (انظر البند 7)، ولا يؤثر ذلك على المعالجة التي تمت قبل السحب.\n\n4. من يطّلع عليها\nفريق مراجعة المحتوى والإدارة في الصدف، وأي مستشار ملتزم بالسرّية يساعدنا في مراجعة فكرة أو معالجة نزاع. وقد نفصح عن البيانات متى ما طلب النظام أو جهة مختصة ذلك.\n\n5. مزوّدو الخدمة والنقل خارج المملكة\nلإيصال فكرتك إلى بريدنا، تستخدم المنصة خدمات طرف ثالث: الموقع مستضاف على GitHub Pages، وتُرسل المقدّمات بالبريد الإلكتروني عبر خدمة FormSubmit. وقد تعالج هذه الجهات البيانات خارج المملكة العربية السعودية. وبتقديمك، توافق على هذا النقل لغرض وحيد هو إيصال فكرتك إلى الصدف.\n\n6. مدة الاحتفاظ\nحتى سنتين من تاريخ التقديم، أو مدة أطول إذا كان هناك نقاش قائم حول المشروع، أو إذا لزم ذلك لإثبات حق نظامي أو الدفاع عنه. بعدها نحذف البيانات أو نحتفظ بما يلزم نظامًا فقط.\n\n7. حقوقك\nيحق لك طلب العلم بكيفية معالجة بياناتك، والوصول إليها، والحصول على نسخة منها، وتصحيحها، وحذفها، وسحب موافقتك، بمراسلتنا على info@sadaf.tv، وسنرد خلال المدة التي يحددها النظام. ولا يُلزم حذفُ بياناتك الصدفَ بحذف مشاريعها أو سجلاتها التي أعدّتها بشكل مستقل.\n\n8. الأمان\nنتخذ إجراءات تقنية وتنظيمية معقولة لحماية بياناتك. ولأن أي نقل عبر الإنترنت لا يخلو تمامًا من المخاطر، نرجو عدم تضمين معلومات شخصية حساسة (مثل أرقام الهوية أو البيانات الصحية أو المالية) في فكرتك.\n\n9. العمر\nهذه المنصة مخصصة لمن أعمارهم 18 سنة فأكثر، ولا نجمع عن علم بيانات من هم دون ذلك.\n\n10. التعديلات\nقد نحدّث هذه السياسة، وتسري النسخة المعروضة في هذه الصفحة من تاريخها.\n\nللتواصل: info@sadaf.tv" },
    en: { terms: "TERMS & CONDITIONS\nAl Sadaf Media Productions (\"Sadaf\", \"we\")\nLast updated: 26 October 2026\n\nBy ticking the acceptance box and submitting an idea through this portal, you (\"you\", \"the Submitter\") agree to these terms. If you do not agree, please do not submit.\n\n1. Eligibility\nYou must be at least 18 years old. You submit only on your own behalf, or on behalf of co-creators who have authorised you to submit and to accept these terms for them.\n\n2. Your submission is not confidential\nYou understand that your submission, and anything you attach or link to, is not received in confidence. No confidential, fiduciary, agency, partnership or employment relationship of any kind is created between you and Sadaf by your submission or by our review of it.\n\n3. Sadaf develops its own projects\nSadaf continually develops films, series and other content, on its own and with partners, and receives a large number of ideas from many sources. You acknowledge that Sadaf may already have, or may later independently create, acquire or receive, projects and material that are similar or identical to your submission in theme, idea, concept, format, title, setting, characters, plot, structure or any other element.\n\n4. Freedom to develop similar projects\nYou agree that Sadaf and its partners, licensees and affiliates are free to develop, produce, distribute and exploit any project, including one that is similar or identical to your submission, without any obligation to you, provided Sadaf does not copy the specific written expression of your submission. Ideas, concepts, themes, formats, genres and stock characters or situations are not owned by any one person, and nothing in your submission restricts Sadaf from using them.\n\n5. No obligation\nSadaf has no obligation to read, review, evaluate, respond to, keep, return or use your submission, or to explain any decision. A decision not to proceed is final.\n\n6. No compensation or credit\nSubmitting does not entitle you to any payment, fee, royalty, profit share, credit or other benefit. Any relationship, compensation or credit can only arise from a separate written agreement signed by an authorised representative of Sadaf. No agreement or promise will be implied from any conversation, meeting, email, review or other conduct.\n\n7. Release and waiver\nTo the fullest extent permitted by law, you release and waive, and agree not to bring, any claim against Sadaf, its partners, licensees, affiliates, employees and contractors arising from or relating to (a) any similarity between your submission and any project or material of Sadaf or its partners, (b) the use of any idea, concept, theme or element that is not protected by law, or (c) Sadaf's review, handling, storage or deletion of your submission.\n\n8. Your remedy\nIf, despite the above, you believe Sadaf has used your protected material, you agree to notify Sadaf in writing at info@sadaf.tv before taking any other action, and to allow at least 60 days to resolve the matter. To the extent permitted by law, any remedy will be limited to monetary damages, and you will not seek to stop, delay or interfere with the development, production, distribution or promotion of any project.\n\n9. Your guarantees\nYou confirm that the submission is your original work, that you own it or have every right needed to submit it, that it does not infringe anyone's rights, and that it contains no unlawful, defamatory or confidential material belonging to others. You agree to compensate Sadaf for any loss, claim or cost arising from a breach of these guarantees.\n\n10. Keep your own copies\nDo not send your only copy of anything. Sadaf may keep, archive or delete submissions at its discretion and is not responsible for any loss or damage to submitted material.\n\n11. Limitation of liability\nTo the fullest extent permitted by law, Sadaf is not liable for any indirect, incidental or consequential loss, or loss of opportunity, arising from your use of this portal or your submission.\n\n12. General\nThese terms are the entire agreement about your submission and override anything said or written before. If any part is found unenforceable, the rest remains in force. Sadaf may update these terms at any time; the version shown when you submit applies to that submission.\n\n13. Governing law and language\nThese terms are governed by the laws of the Kingdom of Saudi Arabia. The competent courts in Riyadh have exclusive jurisdiction. These terms are provided in Arabic and English; if they differ, the Arabic version prevails.\n\nContact: info@sadaf.tv", privacy: "PRIVACY POLICY\nAl Sadaf Media Productions (\"Sadaf\", \"we\")\nLast updated: 26 October 2026\n\nThis policy explains how we handle personal data submitted through this portal, in line with the Personal Data Protection Law of the Kingdom of Saudi Arabia.\n\n1. What we collect\nYour name, mobile number, email address, role or profession, whether this is your first time writing, your city and country, your idea and story details, character descriptions, and any links you share. We do not collect data you do not type in. The portal does not save your answers on the device you use.\n\n2. Why we use it\nOnly to receive, review and assess your submission, to contact you about it, and to keep a record of what was submitted and when (including to protect Sadaf against disputes). We do not sell your data or use it for advertising.\n\n3. Legal basis\nYour consent, given by ticking the box before you submit, and Sadaf's legitimate interest in keeping a record of submissions. You may withdraw consent at any time (see section 7); this does not affect processing already carried out.\n\n4. Who can see it\nSadaf's content review team and management, and any adviser bound by confidentiality who helps us review a submission or handle a dispute. We may disclose data where required by law or by a competent authority.\n\n5. Service providers and transfer outside the Kingdom\nTo deliver your submission to our inbox, the portal uses third-party services: the website is hosted by GitHub Pages and submissions are sent by email through FormSubmit. These providers may process data outside the Kingdom of Saudi Arabia. By submitting, you consent to this transfer for the sole purpose of delivering your submission to Sadaf.\n\n6. How long we keep it\nFor up to two years from the date of submission, or longer if a project discussion is ongoing or if needed to establish or defend a legal claim. After that we delete it or keep only what the law requires.\n\n7. Your rights\nYou may ask to be informed about, access, obtain a copy of, correct, or delete your personal data, and to withdraw your consent, by emailing info@sadaf.tv. We will respond within the period set by law. Deleting your data does not oblige Sadaf to delete its own independently created projects or records.\n\n8. Security\nWe take reasonable technical and organisational measures to protect your data. No internet transmission is completely secure, so please do not include sensitive personal information (such as ID numbers or health or financial details) in your submission.\n\n9. Age\nThis portal is for people aged 18 and over. We do not knowingly collect data from anyone under 18.\n\n10. Changes\nWe may update this policy. The version shown on this page applies from its date.\n\nContact: info@sadaf.tv" }

let S=blank(); let LANG="ar"; let seq=0;
const t=k=>T[LANG][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits=s=>String(s||"").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c));
const I=n=>`<i data-lucide="${n}"></i>`;
const fwd=()=>LANG==="ar"?"arrow-left":"arrow-right";
const bwd=()=>LANG==="ar"?"arrow-right":"arrow-left";

/* ---------------- backdrop scenes: AI-generated cinematic stills (Canva), no real film footage ---------------- */
const SCREEN_SCENE={welcome:"cinema",1:"camera",2:"backstage",3:"city",4:"desert",5:"horizon",6:"cinema",done:"desert"};
const SCENE_SRC={cinema:["cinema",""],camera:["camera",""],backstage:["backstage",""],city:["city",""],desert:["desert",""],horizon:["desert","flip"]};
function buildScenes(){const m=document.getElementById("scenes");m.innerHTML=Object.entries(SCENE_SRC).map(([k,[src,cls]])=>`<div class="scene ${cls}" data-scene="${k}" style="background-image:url(${IMGS[src]})"></div>`).join("");}
function setScene(){const key=S.screen==="step"?SCREEN_SCENE[S.step]:SCREEN_SCENE[S.screen];document.querySelectorAll(".scene").forEach(el=>el.classList.toggle("on",el.dataset.scene===key));}
function buildGrain(){try{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d"),im=x.createImageData(160,160);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);document.getElementById("grain").style.backgroundImage=`url(${c.toDataURL()})`;}catch(e){}}

/* ---------------- field helpers ---------------- */
function tagOf(req){return req?`<span class="tag req">${t("required")}</span>`:`<span class="tag">${t("optional")}</span>`;}
function errOf(k){const m=S.errors[k];return m?`<div class="err" id="err-${k}">${I("circle-alert")}<span>${esc(m)}</span></div>`:"";}
function wrap(k,inner){return `<div class="field${S.errors[k]?" has-err":""}" data-wrap="${k}">${inner}${errOf(k)}</div>`;}
function lbl(k,text,req,forId){return `<label class="label" for="${forId||"f-"+k}"><span>${text}</span>${tagOf(req)}</label>`;}
function input(k,{req=false,label,help,ph="",type="text",mode,auto,dir="auto",max}={}){
  return wrap(k,`${lbl(k,label,req)}${help?`<p class="help">${help}</p>`:""}<input class="input" id="f-${k}" data-f="${k}" type="${type}" ${mode?`inputmode="${mode}"`:""} ${auto?`autocomplete="${auto}"`:""} dir="${dir}" placeholder="${esc(ph)}" value="${esc(S.d[k])}" ${max?`maxlength="${max}"`:""} ${S.errors[k]?`aria-invalid="true" aria-describedby="err-${k}"`:""}>`);}
function area(k,{req=false,label,help,max,rows=4}={}){
  const n=[...S.d[k]].length;
  return wrap(k,`${lbl(k,label,req)}${help?`<p class="help">${help}</p>`:""}<textarea class="textarea" id="f-${k}" data-f="${k}" rows="${rows}" dir="auto" maxlength="${max}" ${S.errors[k]?`aria-invalid="true" aria-describedby="err-${k}"`:""}>${esc(S.d[k])}</textarea><span class="counter${n>max*.9?" near":""}" data-count="${k}" data-max="${max}">${n} / ${max}</span>`);}
function multiChips(k,list,labels,{icon=false,grid=false}={}){
  const sel=S.d[k];
  if(grid) return `<div class="grid-opts">${list.map(([v,ic])=>`<button type="button" class="opt" data-action="toggle" data-k="${k}" data-v="${v}" aria-pressed="${sel.includes(v)}"><span class="tick">${I("check")}</span>${I(ic)}<span>${labels[v]}</span></button>`).join("")}</div>`;
  return `<div class="chips">${list.map(v=>`<button type="button" class="chip" data-action="toggle" data-k="${k}" data-v="${v}" aria-pressed="${sel.includes(v)}"><span class="ck">${I("check")}</span>${labels[v]}</button>`).join("")}</div>`;}

function progress(){
  const n=S.step, frames=[1,2,3,4,5,6].map(i=>`<span class="frame ${i<n?"f-done":i===n?"f-cur":""}"></span>`).join("");
  return `<div class="progress" aria-label="${t("scene")} ${n} ${t("of")} 6">
    <div class="prog-head"><span class="scene-no">${LANG==="ar"?`${t("scene")} ${String(n).padStart(2,"0")} / 06 · ${t("steps")[n-1]}`:`Scene ${String(n).padStart(2,"0")} / 06 · ${t("steps")[n-1]}`}</span>
    <span class="fmt">${I(S.format==="series"?"tv":"clapperboard")}${S.format==="series"?t("fmtSeries"):t("fmtFilm")}${S.step<6?`<button type="button" data-action="go" data-v="2" data-focus="fmtswitch">${t("change")}</button>`:""}</span></div>
    <div class="strip">${frames}</div></div>`;}
function head(i,title,sub){return `<div class="step-head"><span class="ic">${I(STEP_ICONS[i-1])}</span><div><h1 class="step-title" tabindex="-1" id="stepTitle">${title}</h1><p class="step-sub">${sub}</p></div></div>`;}

  return `${head(1,t("s1t"),t("s1s"))}<div class="card">
   ${input("name",{req:true,label:t("name"),ph:t("namePh"),auto:"name",max:120})}
   <div class="row2">

    ${input("email",{req:true,label:t("email"),type:"email",mode:"email",auto:"email",dir:"ltr",ph:"name@example.com",max:160})}

     <p class="help" id="noRole" hidden>${t("noRole")}</p>`)}
   ${(d.role==="other"||d.role==="creative")?`<div class="reveal">${input("roleOther",{req:true,label:t("roleOther"),max:80})}</div>`:""}
   <div class="field"><div class="label"><span id="lbl-first">${t("first")}</span>${tagOf(false)}</div>
     <div class="seg" role="radiogroup" aria-labelledby="lbl-first">${["yes","no"].map(v=>`<button type="button" role="radio" data-action="pick" data-k="firstTime" data-v="${v}" aria-checked="${d.firstTime===v}">${t(v)}</button>`).join("")}</div></div>
   <div class="field"><div class="label"><span>${t("city")}</span>${tagOf(false)}</div>
     <div class="row2"><input class="input" id="f-city" data-f="city" dir="auto" placeholder="${t("cityPh")}" aria-label="${t("cityPh")}" value="${esc(d.city)}" maxlength="80" autocomplete="address-level2"><input class="input" id="f-country" data-f="country" dir="auto" placeholder="${t("countryPh")}" aria-label="${t("countryPh")}" value="${esc(d.country)}" maxlength="80" autocomplete="country-name"></div></div>
  </div>`;}

function step2(){const d=S.d,series=S.format==="series";
  return `${head(2,t("s2t"),t("s2s"))}<div class="card">
   <div class="field"><div class="label"><span id="lbl-fmt">${LANG==="ar"?"نوع التقديم":"Submitting"}</span></div>

function rv(label,val){const empty=val==null||val===""||(Array.isArray(val)&&!val.length);return `<dt>${label}</dt><dd class="${empty?"none":""}" dir="auto">${empty?t("none"):esc(Array.isArray(val)?val.join("، "):val)}</dd>`;}
function sec(n,icon,body){return `<section class="rev-sec"><header><h3>${I(icon)}${t("steps")[n-1]}</h3><button type="button" class="edit-btn" data-action="edit" data-v="${n}">${I("pencil")}${t("edit")}</button></header><dl>${body}</dl></section>`;}
function step6(){const d=S.d,series=S.format==="series";
  const role=d.role?(t("roles")[d.role]+(d.roleOther?` — ${d.roleOther}`:"")):"";

  const chars=d.chars.filter(c=>c.name||c.role||c.desc).map(c=>[c.name,c.role].filter(Boolean).join(" · ")+(c.desc?`\n${c.desc}`:"")).join("\n\n");
  const files=d.files.filter(f=>f.status!=="bad").map(f=>f.name);
  return `${head(6,t("s6t"),t("s6s"))}<div class="rev">
   ${sec(1,"user",rv(t("name"),d.name)+rv(t("phone"),d.phone?`${d.code} ${d.phone}`:"")+rv(t("email"),d.email)+rv(t("role"),role)+rv(t("first"),d.firstTime?t(d.firstTime):"")+rv(t("city"),[d.city,d.country].filter(Boolean).join(LANG==="ar"?"، ":", ")))}
   ${sec(2,"clapperboard",rv(LANG==="ar"?"نوع التقديم":"Format",series?t("fmtSeries"):t("fmtFilm"))+rv(series?t("titleSeries"):t("titleFilm"),d.title)+rv(t("genre"),genres)+rv(t("audience"),auds)+rv(series?t("episodes"):t("runtime"),size))}
   ${sec(3,"map-pin",rv(t("setting"),d.setting)+rv(t("period"),d.period?t("periods")[d.period]:"")+(["past","future","multi"].includes(d.period)?rv(t("year"),d.periodDetail):""))}
   ${sec(4,"book-open",rv(t("hook"),d.hook)+rv(t("synopsis"),d.synopsis)+rv(t("conflict"),d.conflict)+rv(t("chars"),chars))}
   ${sec(5,"layers",rv(t("stage"),d.stage?t("stages")[d.stage]:"")+(CONFIG.fileUploads?rv(t("upT"),files):rv(t("linkL"),d.filesLink)))}
   <div class="agree">
    <label class="check${S.errors.a1?" has-err":""}" data-wrap="a1"><input type="checkbox" id="f-a1" data-chk="a1" ${d.a1?"checked":""}><span>${t("agree1")}</span></label>
    ${errOf("a1")}
    <div class="check${S.errors.a2?" has-err":""}" data-wrap="a2"><input type="checkbox" id="f-a2" data-chk="a2" ${d.a2?"checked":""} aria-labelledby="a2txt"><span id="a2txt">${t("agree2a")}<button type="button" class="link" data-action="legal" data-v="terms">${t("terms")}</button>${t("and")}<button type="button" class="link" data-action="legal" data-v="privacy">${t("privacy")}</button>${t("agree2b")}</span></div>
    ${errOf("a2")}
   </div>
   ${S.sendError?`<div class="notice err-box" role="alert">${I("triangle-alert")}<span>${t("e").send}</span></div>`:""}
   ${LIVE?"":`<div class="notice">${I("info")}<span>${t("previewNote")}</span></div>`}
  </div>`;}

const app=document.getElementById("app"), navMount=document.getElementById("navMount");

  else if(S.screen==="done"){app.innerHTML=done();navMount.innerHTML="";}
  else{
    const body=[null,step1,step2,step3,step4,step5,step6][S.step]();
    app.innerHTML=`<div class="col${scrollTop?" enter":""}">${progress()}${body}</div>`;
    const last=S.step===6;
    navMount.innerHTML=`<nav class="nav" aria-label="Steps"><div class="col">
      <button type="button" class="btn btn-quiet" data-action="back">${I(bwd())}${t("back")}</button>
      <span class="spacer"></span>
      ${S.returnToReview&&!last?`<button type="button" class="btn btn-quiet" data-action="toreview">${I("clipboard-check")}${t("toReview")}</button>`:""}
      ${last?`<button type="button" class="btn btn-primary" data-action="submit" ${S.submitting?"disabled aria-busy=\"true\"":""}>${S.submitting?`<span class="spin">${I("loader-circle")}</span>${t("sending")}`:`${I("send")}${t("submit")}`}</button>`
        :`<button type="button" class="btn btn-primary" data-action="next">${t("next")}${I(fwd())}</button>`}
    </div></nav>`;
  }

}
function icons(){if(window.lucide&&lucide.createIcons)lucide.createIcons({attrs:{"stroke-width":1.5}});}
function autosize(el){el.style.height="auto";el.style.height=el.scrollHeight+2+"px";}
function autosizeAll(){document.querySelectorAll("textarea").forEach(autosize);}

/* ---------------- validation ---------------- */
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validate(n){const d=S.d,e={},E=t("e");
  if(n===1){if(d.name.trim().length<2)e.name=E.name;
    const p=digits(d.phone).replace(/[\s\-()]/g,"").replace(/^0+/,"");
    if(!p)e.phone=E.req;else if(!/^\d+$/.test(p))e.phone=E.phone;else if(d.code==="+966"&&!/^5\d{8}$/.test(p))e.phone=E.phoneSA;else if(p.length<6||p.length>14)e.phone=E.phone;
    if(!d.email.trim())e.email=E.req;else if(!EMAIL.test(d.email.trim()))e.email=E.email;
    if(!d.role)e.role=E.role;else if((d.role==="other"||d.role==="creative")&&!d.roleOther.trim())e.roleOther=E.roleOther;}
  if(n===2){if(!d.title.trim())e.title=E.title;if(!d.genres.length)e.genres=E.genre;
    if(d.genres.includes("other")&&!d.genreOther.trim())e.genreOther=E.genreOther;
    if(d.auds.includes("other")&&!d.audOther.trim())e.audOther=E.audOther;
    const k=S.format==="series"?"eps":"runtime",u=S.format==="series"?d.epsUndecided:d.runtimeUndecided,v=digits(d[k]).trim();
    if(!u&&v&&!(/^\d+$/.test(v)&&+v>0&&+v<10000))e[k]=E.num;}
  if(n===4){if(!d.hook.trim())e.hook=E.hook;if(!d.synopsis.trim())e.synopsis=E.syn;}
  if(n===5){if(!d.stage)e.stage=E.stage;if(d.filesLink.trim()&&!/^https?:\/\/\S+\.\S+/i.test(d.filesLink.trim()))e.filesLink=t("badLink");}
  if(n===6){if(!d.a1)e.a1=E.agree;if(!d.a2)e.a2=E.agree;}
  return e;}
function showErrors(e){S.errors=e;render();const first=Object.keys(e)[0];if(!first)return;
  const w=document.querySelector(`[data-wrap="${first}"]`);if(w){w.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const f=w.querySelector("input:not([type=search]),textarea,button[data-action]");if(f)f.focus({preventScroll:true});}}
function goStep(n,opts={}){S.step=n;S.screen="step";S.errors={};S.delPending=null;render({scrollTop:true,...opts});}

/* ---------------- files ---------------- */
function addFiles(list){const d=S.d;
  for(const file of list){const ext=(file.name.split(".").pop()||"").toLowerCase();const good=d.files.filter(f=>f.status!=="bad").length;
    const f={id:++seq,name:file.name,size:file.size,file,status:"local",pct:0};
    if(!CONFIG.exts.includes(ext)){f.status="bad";f.err=t("fType");}
    else if(file.size>CONFIG.maxFileMB*1048576){f.status="bad";f.err=t("fSize");}
    else if(good>=CONFIG.maxFiles){f.status="bad";f.err=t("fMax");}
    d.files.push(f); if(f.status!=="bad"&&LIVE&&CONFIG.uploadEndpoint)upload(f);}
  render();}
function upload(f){/* Live upload hook: the developer wires this to secure storage (signed URL). */
  f.status="up";f.pct=0;const ep=CONFIG.uploadEndpoint;
  const x=new XMLHttpRequest();x.open("POST",ep);
  x.upload.onprogress=ev=>{if(ev.lengthComputable){f.pct=Math.round(ev.loaded/ev.total*100);const b=document.querySelector(`[data-v="${f.id}"]`)?.closest(".file")?.querySelector(".bar i");if(b)b.style.width=f.pct+"%";}};
  x.onload=()=>{if(x.status>=200&&x.status<300){try{f.remoteId=JSON.parse(x.responseText).id}catch(e){}f.status="done";}else f.status="fail";if(S.step===5)render();};
  x.onerror=()=>{f.status="fail";if(S.step===5)render();};
  const fd=new FormData();fd.append("file",f.file);x.send(fd);}
function bindDrop(){const z=document.getElementById("drop");if(!z)return;
  ["dragenter","dragover"].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.remove("over");}));
  z.addEventListener("drop",e=>{if(e.dataTransfer?.files?.length)addFiles(e.dataTransfer.files);});
  document.getElementById("fileIn").addEventListener("change",e=>{addFiles(e.target.files);e.target.value="";});}

/* ---------------- submit ---------------- */
async function submit(){
  if(S.submitting)return;
  const e=validate(6);if(Object.keys(e).length){showErrors(e);return;}
  if(S.d.files.some(f=>f.status==="up"))return;
  S.submitting=true;S.sendError=false;render();
  if(!LIVE){await new Promise(r=>setTimeout(r,1100));S.submitting=false;S.screen="done";render({scrollTop:true,focus:"none"});return;}
  try{const d=S.d,E=T.en,series=S.format==="series";
    const now=new Date(),ref=S.reference||("SAD-"+String(now.getFullYear()).slice(2)+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6).toUpperCase());
    S.reference=ref;
    const L=(v,map)=>v?map[v]:"";
    const chars=d.chars.filter(c=>c.name||c.role||c.desc).map((c,i)=>`${i+1}. ${[c.name,c.role].filter(Boolean).join(" — ")}${c.desc?"\n   "+c.desc:""}`).join("\n");
    const payload={
      _subject:`New ${series?"series":"film"} idea: ${d.title} (${ref})`,_template:"table",_captcha:"false",
      "Reference":ref,"Submitted":now.toLocaleString("en-GB",{timeZone:"Asia/Riyadh"})+" (Riyadh)","Interface language":LANG==="ar"?"Arabic":"English",
      "Format":series?"Series":"Film",
      "Full name":d.name,"email":d.email.trim(),"Mobile":`${d.code} ${digits(d.phone).replace(/\s+/g,"")}`,
      "Role":L(d.role,E.roles)+(d.roleOther?` — ${d.roleOther}`:""),"First time writing":d.firstTime?E[d.firstTime]:"",
      "Based in":[d.city,d.country].filter(Boolean).join(", "),
      "Title":d.title,"Genre":d.genres.map(g=>g==="other"&&d.genreOther?d.genreOther:E.genres[g]).join(", "),
      "Target audience":d.auds.map(a=>a==="other"&&d.audOther?d.audOther:E.auds[a]).join(", "),
      [series?"Episodes":"Runtime (minutes)"]:series?(d.epsUndecided?"Not decided yet":digits(d.eps)):(d.runtimeUndecided?"Not decided yet":digits(d.runtime)),
      "Setting":d.setting,"Story period":L(d.period,E.periods),"Year or period":d.periodDetail,
      "Hook":d.hook,"Synopsis":d.synopsis,"Central conflict":d.conflict,"Main characters":chars,
      "Development stage":L(d.stage,E.stages),"Files link":d.filesLink,
      "Confirmed original idea":d.a1?"Yes":"No","Agreed to terms and privacy":d.a2?"Yes":"No"};
    const res=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error(res.status);
    const j=await res.json().catch(()=>({}));if(j.success===false||j.success==="false")throw new Error(j.message||"rejected");
    S.submitting=false;S.screen="done";render({scrollTop:true,focus:"none"});
  }catch(err){S.submitting=false;S.sendError=true;render();document.querySelector(".err-box")?.scrollIntoView({block:"center"});}
}

function bump(){if(document.getElementById("idleBox"))return;clearTimeout(idleT);if(!hasData())return;idleT=setTimeout(showIdle,CONFIG.idleSeconds*1000);}
function showIdle(){cdLeft=CONFIG.idleCountdown;
  modal.innerHTML=`<div class="overlay"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="it" id="idleBox">
   <h2 id="it">${I("hourglass")}${t("idleT")}</h2><p class="help" style="margin:0">${t("idleP")}</p><div class="count-big" id="cd">${cdLeft}</div>
   <div class="acts"><button type="button" class="btn btn-quiet" data-action="idlenew">${t("idleNew")}</button><button type="button" class="btn btn-primary" data-action="idlestay" id="istay">${t("idleStay")}</button></div></div></div>`;
  icons();document.getElementById("istay").focus();
  cdT=setInterval(()=>{cdLeft--;const c=document.getElementById("cd");if(c)c.textContent=cdLeft;if(cdLeft<=0)resetAll();},1000);}
function resetAll(){clearInterval(cdT);clearTimeout(idleT);modal.innerHTML="";S=blank();render({scrollTop:true,focus:"none"});}
["pointerdown","keydown","input","scroll","touchstart"].forEach(ev=>addEventListener(ev,bump,{passive:true}));

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  if(b.classList.contains("overlay")&&e.target.closest("[data-stop]"))return;
  const a=b.dataset.action,v=b.dataset.v,k=b.dataset.k,d=S.d;
  switch(a){
    case"lang":if(LANG!==v){LANG=v;render();}break;
    case"start":S.format=v;goStep(1);break;
    case"format":S.format=v;S.errors={};render({focus:`[data-action="format"][data-v="${v}"]`});break;
    case"go":goStep(+v,{focus:"#fmtswitch button[aria-checked=true]"});break;
    case"next":{const er=validate(S.step);if(Object.keys(er).length){showErrors(er);break;}goStep(S.returnToReview?6:S.step+1);break;}
    case"back":if(S.step===1){S.screen="welcome";S.errors={};render({scrollTop:true,focus:"none"});}else goStep(S.step-1);break;
    case"toreview":{const er=validate(S.step);if(Object.keys(er).length){showErrors(er);break;}goStep(6);break;}
    case"edit":S.returnToReview=true;goStep(+v);break;
    case"toggle":{const arr=d[k],i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);delete S.errors[k];render({focus:`[data-action="toggle"][data-k="${k}"][data-v="${v}"]`});break;}
    case"pick":d[k]=d[k]===v&&k!=="role"&&k!=="stage"?"":v;delete S.errors[k];render({focus:`[data-action="pick"][data-k="${k}"][data-v="${v}"]`});break;
    case"flag":d[k]=!d[k];const nk=k==="epsUndecided"?"eps":"runtime";if(d[k]){d[nk]="";delete S.errors[nk];}render({focus:`[data-action="flag"]`});break;
    case"addchar":{const id=++seq;d.chars.push({id,name:"",role:"",desc:""});render({focus:`#c-${id}-n`});break;}
    case"del":{const c=d.chars.find(c=>c.id==v);if(c&&!c.name&&!c.role&&!c.desc){d.chars=d.chars.filter(c=>c.id!=v);render({focus:"#addCharBtn"});}else{S.delPending=+v;render({focus:`[data-action="delno"]`});}break;}
    case"delyes":d.chars=d.chars.filter(c=>c.id!=v);S.delPending=null;render({focus:"#addCharBtn"});break;
    case"delno":{const id=S.delPending;S.delPending=null;render({focus:`[data-action="del"][data-v="${id}"]`});break;}
    case"browse":document.getElementById("fileIn")?.click();break;
    case"rmfile":d.files=d.files.filter(f=>f.id!=v);render({focus:`[data-action="browse"]`});break;
    case"retry":{const f=d.files.find(f=>f.id==v);if(f&&LIVE&&CONFIG.uploadEndpoint){upload(f);render();}break;}
    case"legal":openLegal(v);break;
    case"closemodal":if(e.target===b||b.id==="mclose")closeModal();break;
    case"submit":submit();break;
    case"home":resetAll();break;
    case"idlestay":clearInterval(cdT);modal.innerHTML="";bump();break;
    case"idlenew":resetAll();break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.querySelector("[data-stop]"))closeModal();});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.f){const k=el.dataset.f;S.d[k]=el.value;
    if(S.errors[k]){delete S.errors[k];const w=el.closest("[data-wrap]");w?.classList.remove("has-err");w?.querySelector(".err")?.remove();el.removeAttribute("aria-invalid");}
    const c=document.querySelector(`[data-count="${k}"]`);if(c){const n=[...el.value].length,m=+c.dataset.max;c.textContent=`${n} / ${m}`;c.classList.toggle("near",n>m*.9);}
    if(el.tagName==="TEXTAREA")autosize(el);}
  if(el.dataset.c){const ch=S.d.chars.find(c=>c.id==el.dataset.c);if(ch)ch[el.dataset.cf]=el.value;if(el.tagName==="TEXTAREA")autosize(el);}
  if(el.hasAttribute("data-roleq")){const q=el.value.trim().toLowerCase();let any=false;
    document.querySelectorAll("#roleChips .chip").forEach(c=>{const hit=!q||c.dataset.label.toLowerCase().includes(q);c.hidden=!hit;if(hit)any=true;});
    document.getElementById("noRole").hidden=any;}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.f==="code"){S.d.code=el.value;delete S.errors.phone;render({focus:"#f-phone"});}
  if(el.dataset.chk){S.d[el.dataset.chk]=el.checked;delete S.errors[el.dataset.chk];render({focus:`#f-${el.dataset.chk}`});}
});

buildScenes(); buildGrain(); render();
</script>
